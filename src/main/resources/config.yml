# ============================================================================
#  JustLogs configuration
#  Reload most values with /justlogs reload. Storage and command aliases need a restart.
#  Support: https://github.com/filasik/justLogs
# ============================================================================

# Config format version. Do not change: when you update the plugin, options that are new in the
# newer version are added to this file automatically (your values stay, a backup is saved first).
# (Developer: raise this number whenever you add a key, and add the key with its comment here.)
config-version: 7

# Language of all player-facing messages: en, cs.
# The files plugins/JustLogs/messages_<locale>.yml are yours to edit; missing keys fall back to the built-in text.
locale: en

# Check GitHub releases for a newer version (async, once at startup and then every 12 hours).
# Players with justlogs.admin are told when they join.
update-check: true

command:
  # Short names for /justlogs. Restart required. Remove an alias if another plugin already owns it.
  aliases: [jo, jlogs]

# Name of this server inside a shared database (several servers can log into one MariaDB).
# Leave empty on a single server.
server-name: ""

# Anonymous usage statistics through bStats (server count, Minecraft version, ...).
# Set to false to switch them off for this plugin. The global switch is plugins/bStats/config.yml.
metrics: true

logging:
  # What gets logged. A disabled logger costs nothing.
  block-place: true
  block-break: true
  # Water and lava buckets
  buckets: true
  # Fire: ignited and burned blocks, attributed to the player who lit it (else #fire, #lava, #lightning)
  fire: true
  # Explosions of TNT, creepers, beds, ...; TNT is attributed to the player who lit it (else #tnt)
  explosions: true
  # Water and lava flowing over other blocks (attributed to who poured the bucket, else #water / #lava)
  fluids: true
  # Sand, gravel, concrete powder and anvils falling and landing
  falling-blocks: true
  # Blocks pushed or pulled by pistons (noisy, off by default)
  pistons: false
  # Ice, cobblestone, obsidian, concrete, portals, sponge absorption, grass/mushroom spread and melting/fading
  form-fade: true
  # Trees and mushrooms growing (bone meal player, else #nature)
  growth: true
  # Crops, cactus, sugar cane, bamboo and kelp growing naturally (noisy, off by default)
  crop-growth: false
  # Leaves rotting away (very noisy, off by default)
  leaf-decay: false
  # Endermen, farmland trampling, silverfish and other mobs changing blocks
  entity-changes: true
  # Items put into and taken out of chests, barrels, shulker boxes, hoppers, furnaces, ... (a:container). Broken chests also
  # keep their contents so a rollback can put them back.
  containers: true
  # Sign text edits (who wrote what on which side). Look up with a:sign. Not part of rollback yet.
  signs: true
  # Player chat messages (a:chat, search text with k:)
  chat: true
  # Commands executed by players (a:command). Passwords in /login, /register, /2fa, ... are always redacted.
  commands: true
  # Commands never logged at all (without leading slash, e.g. [msg, tell])
  command-blacklist: []
  # Player join and quit events (a:session, +session, -session) with HMAC-hashed IP
  sessions: true
  # Store plain IP addresses in addition to the HMAC hash (false by default for privacy)
  log-raw-ip: false
  # Doors, buttons, levers, pressure plates, note blocks and bells (a:click, debounced per player/block)
  interactions: true
  # Items dropped on the ground (a:drop), picked up (a:pickup) and crafted (a:craft)
  item-drops: true
  item-pickups: false
  item-crafts: false
  # Entity kills, player deaths, item frames/paintings and vehicles (a:entity, a:kill)
  entity-kills: true
  player-deaths: true
  hanging: true
  vehicles: true
  # Worlds that are never logged (exact names)
  worlds-blacklist: []

queue:
  # Log records are collected in memory and written in batches by one background thread.
  flush-interval-ms: 250
  batch-size: 2000
  # When the database cannot keep up, fluid flow and clicks are dropped at this size and everything at twice this size.
  max-size: 500000
  # On shutdown the remaining records are written, for at most this long.
  shutdown-timeout-seconds: 30

lookup:
  # Rows per page in chat
  page-size: 8
  # Largest r: a player without justlogs.lookup.global may use
  max-radius: 100
  # Radius used when a player gives no scope at all (no u:, r:, b: or w:)
  default-radius: 10
  # Time window used when a query has no t:
  default-time: 3d
  # Page counter stops counting at this many rows (shows e.g. 12/1000+)
  count-cap: 100000
  # How long /justlogs page keeps the last result of a sender
  result-ttl-seconds: 300

rollback:
  # Most log rows one rollback/restore may load. Narrow the query (u:, r:, t:) if you hit it.
  max-rows: 500000
  # A rollback/restore changing more blocks than this waits for /jo confirm (0 = always ask)
  confirm-above: 10000
  # Seconds a pending preview or confirmation stays valid
  confirm-expire-seconds: 60
  # Time budget per server tick while changing blocks; a big rollback takes several ticks instead of freezing the server
  ms-per-tick: 8
  # Largest preview (ghost blocks shown only to you); bigger rollbacks need /jo confirm without preview
  preview-max-blocks: 50000

purge:
  # Automatically delete log rows older than this many days (0 = disabled, manual /jo purge only)
  retention-days: 0
  # How often the automatic retention purge runs (hours)
  interval-hours: 24

storage:
  # sqlite  = single file in the plugin folder, zero setup (default)
  # mariadb = MariaDB or MySQL server (use this to share data between servers)
  type: sqlite
  sqlite:
    file: justlogs.db
    # Concurrent database connections (writes are serialized by SQLite anyway)
    pool-size: 3
  mariadb:
    host: localhost
    port: 3306
    database: justlogs
    user: justlogs
    password: change-me
    pool-size: 6
    # TLS mode of the connection. Leave empty for the driver default.
    # MySQL 8+ with a self-signed certificate (the default install) fails with
    # "Cannot use authentication plugin caching_sha2_password with a Self signed certificates":
    # use "trust" (encrypted, certificate not verified), or "disable" on a trusted local network.
    # Other values: verify-ca, verify-full (need a proper certificate).
    ssl-mode: ""
