name: ${name}
version: '${version}'
main: ${main}
loader: ${loader}
description: '${description}'
website: ${website}
authors: [filasik]
api-version: '${apiVersion}'
# Everything goes through the Scheduler abstraction (global / entity / async), so Folia works.
# Set to false if you add code that touches worlds or other entities from the wrong thread.
folia-supported: true
# Soft / hard dependencies (example: an economy through Vault):
# dependencies:
#   server:
#     Vault:
#       load: BEFORE
#       required: true
#       join-classpath: true
permissions:
  justlogs.use:
    description: Base command and help
    default: op
  justlogs.inspect:
    description: Inspector mode (click a block to see its history)
    default: op
  justlogs.lookup:
    description: Search the log (/jo lookup, /jo near, /jo page)
    default: op
  justlogs.lookup.container:
    description: Look up what was put into and taken out of containers
    default: op
  justlogs.lookup.global:
    description: Search the whole server and use a radius above lookup.max-radius
    default: op
  justlogs.rollback:
    description: Put blocks back (/jo rollback, /jo undo, /jo confirm)
    default: op
  justlogs.restore:
    description: Apply rolled-back changes again (/jo restore)
    default: op
  justlogs.rollback.global:
    description: Roll back or restore without a radius (whole world or server)
    default: op
  justlogs.teleport:
    description: Click a coordinate in a result to teleport there
    default: op
  justlogs.status:
    description: /jo status
    default: op
  justlogs.reload:
    description: /jo reload
    default: op
  justlogs.notify:
    description: Told about new plugin versions
    default: op
  justlogs.helper:
    description: Package for helpers - look things up, never change anything
    default: false
    children:
      justlogs.use: true
      justlogs.inspect: true
      justlogs.lookup: true
      justlogs.lookup.container: true
      justlogs.teleport: true
  justlogs.admin:
    description: Everything
    default: op
    children:
      justlogs.helper: true
      justlogs.lookup.global: true
      justlogs.rollback: true
      justlogs.restore: true
      justlogs.rollback.global: true
      justlogs.status: true
      justlogs.reload: true
      justlogs.notify: true
